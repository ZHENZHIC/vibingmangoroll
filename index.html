<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>中国宏观数据</title>
  <style>
    :root {
      --bg:#f1f4f9;--surface:#fff;--text:#0b1a33;--secondary:#475569;
      --muted:#94a3b8;--line:#e2e8f0;--line-light:#f1f5f9;--accent:#2563eb;
      --accent-soft:#eef2ff;--red:#dc2626;--green:#16a34a;
      --radius:16px;--shadow:0 12px 32px rgba(15,23,42,.07);
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;color:var(--text);font-family:var(--font);background:
      radial-gradient(ellipse at 16% 18%,rgba(37,99,235,.05),transparent 48%),
      linear-gradient(180deg,#f8fafc 0%,var(--bg) 100%);line-height:1.6}
    .topbar{position:sticky;top:0;z-index:80;min-height:60px;padding:10px 24px;display:flex;
      align-items:center;gap:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line)}
    .title-kicker{margin:0;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em}
    h1{margin:1px 0 0;font-size:20px;line-height:1.3}
    .period-note{margin-left:auto;padding:5px 9px;border-radius:999px;background:var(--accent-soft);
      color:var(--accent);font-size:11px;font-weight:800;white-space:nowrap}
    .shell{max-width:1680px;margin:0 auto;padding:24px}
    .tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}
    .tab{border:1px solid var(--line);background:#fff;color:var(--secondary);border-radius:10px;
      padding:9px 14px;font:700 13px/1 var(--font);cursor:pointer;white-space:nowrap}
    .tab.active{border-color:#bfdbfe;background:var(--accent-soft);color:var(--accent);
      box-shadow:0 0 0 3px rgba(37,99,235,.06)}
    .subtabs{display:flex;gap:6px;margin:-4px 0 14px;padding:4px;border:1px solid var(--line);
      border-radius:11px;background:rgba(255,255,255,.72);width:max-content;max-width:100%;overflow:auto}
    .subtabs[hidden]{display:none}.subtab{border:0;background:transparent;color:var(--secondary);
      border-radius:8px;padding:8px 12px;font:700 12px/1 var(--font);cursor:pointer;white-space:nowrap}
    .subtab.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(15,23,42,.09)}
    .panel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);overflow:hidden}.panel.active{display:block}
    .panel-head{display:flex;align-items:center;gap:16px;padding:17px 18px;border-bottom:1px solid var(--line)}
    .panel-title{min-width:0}.panel-title h2{font-size:17px;margin:0}
    .legend{display:flex;gap:12px;align-items:center;padding:10px 18px;color:var(--secondary);font-size:11px;
      border-bottom:1px solid var(--line-light);background:#fbfdff;flex-wrap:wrap}
    .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
    .table-wrap{overflow-x:auto;overflow-y:visible}
    table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
    th,td{height:48px;padding:9px 12px;border-right:1px solid var(--line-light);
      border-bottom:1px solid var(--line-light);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
    thead th{position:sticky;top:0;z-index:20;background:#f8fafc;color:#64748b;font-size:11px;font-weight:760}
    .group{position:sticky;left:0;z-index:11;width:112px;min-width:112px;text-align:left;background:#f8fafc;
      color:#334155;font-weight:760;vertical-align:top}
    .name{position:sticky;left:112px;z-index:10;width:250px;min-width:250px;text-align:left;background:#fff;font-weight:650}
    thead .group,thead .name{z-index:30;background:#f1f5f9}
    tbody tr:hover td,tbody tr:hover .name{filter:brightness(.985)}
    .trend{width:156px;min-width:156px;text-align:center;background:#fff}
    .delta{width:104px;min-width:104px;font-weight:760}
    .period{width:72px;min-width:72px;text-align:center}
    .kind{display:inline-flex;margin-left:6px;padding:1px 5px;border-radius:5px;font-size:9px;font-weight:760}
    .kind.derived{color:#7c3aed;background:#f5f3ff}.kind.commercial{color:#b45309;background:#fffbeb}
    .up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--muted)}
    .spark{width:136px;height:36px;display:block;margin:auto;overflow:visible}
    .empty{padding:58px;text-align:center;color:var(--muted)}
    .foot{padding:11px 18px;color:#64748b;font-size:11px;border-top:1px solid var(--line);background:#fbfdff}
    @media(max-width:780px){
      .topbar{padding:10px}.shell{padding:14px 10px}.name{left:88px;width:190px;min-width:190px}
      .group{width:88px;min-width:88px}.panel-head{padding:14px}.legend{padding:10px 14px}
    }
  </style>
</head>

  <script>
    const DATA=JSON.parse(document.getElementById('page-data').textContent);
    const tabs=document.getElementById('tabs'),inflationTabs=document.getElementById('inflation-tabs'),panels=document.getElementById('panels');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const num=v=>v==null||Number.isNaN(Number(v))?null:Number(v);
    function fmt(v){
      v=num(v);if(v==null)return '—';
      const digits=Math.abs(v)>=1000?1:(Number.isInteger(v)?0:1);
      return v.toLocaleString('zh-CN',{maximumFractionDigits:digits});
    }
    function deltaClass(v){v=num(v);return v==null||v===0?'flat':v>0?'up':'down'}
    function spark(values){
      const pts=values.map(num).filter(v=>v!=null);if(pts.length<2)return '<span class="flat">—</span>';
      const lo=Math.min(...pts),hi=Math.max(...pts),span=hi-lo||1;
      const xy=pts.map((v,i)=>[3+i*130/(pts.length-1),32-(v-lo)*28/span]);
      const path=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),last=xy[xy.length-1];
      return `<svg class="spark" viewBox="0 0 136 36" aria-hidden="true"><path d="${path}" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="${last[0]}" cy="${last[1]}" r="2.8" fill="#2563eb"/></svg>`;
    }
    function heat(value,row,dataset,periods){
      value=num(value);if(value==null)return '';
      let score=0;
      if(dataset==='china_pmi_heatmap'){const base=num(row.benchmark)??50;score=Math.max(-1,Math.min(1,(value-base)/7));}
      else{const vals=periods.map(p=>num(row.values[p])).filter(v=>v!=null),lo=Math.min(...vals),hi=Math.max(...vals);if(!Number.isFinite(lo)||hi===lo)return 'background:#f8fafc';score=((value-lo)/(hi-lo))*2-1;}
      if(Math.abs(score)<.06)return 'background:#f8fafc';
      const alpha=(.07+Math.abs(score)*.18).toFixed(3);
      return score>0?`background:rgba(220,38,38,${alpha});color:#991b1b`:`background:rgba(22,163,74,${alpha});color:#166534`;
    }
    function groupRows(rows){const out=[];for(const row of rows){let group=out.find(item=>item.name===row.category);if(!group){group={name:row.category,rows:[]};out.push(group)}group.rows.push(row)}return out}
    function renderTable(index){
      const table=DATA.tables[index],panel=document.getElementById('panel-'+index),periods=table.periods.slice(0,13),pmi=table.dataset==='china_pmi_heatmap';
      let body='';
      for(const group of groupRows(table.rows)){
        group.rows.forEach((row,rowIndex)=>{
          const chronological=[...periods].reverse().map(period=>row.values[period]),valid=periods.map(period=>num(row.values[period])).filter(value=>value!=null);
          const latest=valid[0]??null,previous=valid[1]??null,previousDelta=latest!=null&&previous!=null?latest-previous:null;
          const delta=pmi?(num(row.summary?.delta_previous)??previousDelta):previousDelta;
          const baseDelta=latest==null?null:latest-(num(row.benchmark)??50);
          const kind=row.data_kind==='raw'?'':`<span class="kind ${esc(row.data_kind)}">${row.data_kind==='derived'?'派生':'商业'}</span>`;
          body+='<tr>'+(rowIndex===0?`<th class="group" rowspan="${group.rows.length}">${esc(group.name)}</th>`:'')+
            `<th class="name">${esc(row.name)}${kind}</th><td class="trend">${spark(chronological)}</td>`+
            (pmi?`<td class="delta ${deltaClass(baseDelta)}">${fmt(baseDelta)}</td><td class="delta ${deltaClass(delta)}">${fmt(delta)}</td>`:`<td class="delta ${deltaClass(delta)}">${fmt(delta)}</td>`)+
            periods.map(period=>`<td class="period" style="${heat(row.values[period],row,table.dataset,periods)}">${fmt(row.values[period])}</td>`).join('')+'</tr>';
        });
      }
      const summary=pmi?'<th class="delta">相对基准</th><th class="delta">相对上月</th>':'<th class="delta">较前值</th>';
      panel.querySelector('.table-wrap').innerHTML=table.rows.length?`<table><thead><tr><th class="group">分类</th><th class="name">指标</th><th class="trend">近13期走势</th>${summary}${periods.map(period=>`<th class="period">${esc(period)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`:'<div class="empty">暂无数据</div>';
    }
    DATA.tables.forEach((table,index)=>{
      panels.insertAdjacentHTML('beforeend',`<section class="panel ${index===0?'active':''}" id="panel-${index}"><div class="panel-head"><div class="panel-title"><h2>${esc(table.title)}</h2></div></div><div class="legend"><span><i style="background:rgba(220,38,38,.22)"></i>相对较高</span><span><i style="background:#f8fafc;border:1px solid #e2e8f0"></i>中性</span><span><i style="background:rgba(22,163,74,.22)"></i>相对较低</span><span>色阶用于辅助阅读，空值不跨期填补</span></div><div class="table-wrap"></div><div class="foot">本页面固定展示最新13期；缺失数据以“—”表示。</div></section>`);
      renderTable(index);
    });
    const indexByDataset=Object.fromEntries(DATA.tables.map((table,index)=>[table.dataset,index]));
    const cpiIndex=indexByDataset.china_cpi_detail,ppiIndex=indexByDataset.china_ppi_detail;
    const topTabs=[
      {label:DATA.tables[indexByDataset.china_macro_overview].title,index:indexByDataset.china_macro_overview,group:'single'},
      {label:DATA.tables[indexByDataset.china_pmi_heatmap].title,index:indexByDataset.china_pmi_heatmap,group:'single'},
      {label:'通胀',index:cpiIndex,group:'inflation'}
    ];
    topTabs.forEach((item,index)=>tabs.insertAdjacentHTML('beforeend',`<button class="tab ${index===0?'active':''}" data-index="${item.index}" data-group="${item.group}" type="button">${esc(item.label)}</button>`));
    [cpiIndex,ppiIndex].forEach((index,subIndex)=>inflationTabs.insertAdjacentHTML('beforeend',`<button class="subtab ${subIndex===0?'active':''}" data-index="${index}" type="button">${esc(DATA.tables[index].title)}</button>`));
    let activeInflation=cpiIndex;
    function activatePanel(index){document.querySelectorAll('.panel').forEach((panel,panelIndex)=>panel.classList.toggle('active',panelIndex===index));}
    function activateDataset(dataset){
      const index=indexByDataset[dataset];if(index==null)return;
      const inflation=index===cpiIndex||index===ppiIndex;
      tabs.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',inflation?button.dataset.group==='inflation':Number(button.dataset.index)===index));
      inflationTabs.hidden=!inflation;
      if(inflation){activeInflation=index;inflationTabs.querySelectorAll('.subtab').forEach(button=>button.classList.toggle('active',Number(button.dataset.index)===index));}
      activatePanel(index);window.scrollTo({top:0,behavior:'smooth'});
    }
    tabs.addEventListener('click',event=>{const button=event.target.closest('.tab');if(!button)return;activateDataset(DATA.tables[Number(button.dataset.index)].dataset)});
    inflationTabs.addEventListener('click',event=>{const button=event.target.closest('.subtab');if(!button)return;activateDataset(DATA.tables[Number(button.dataset.index)].dataset)});
  </script>
